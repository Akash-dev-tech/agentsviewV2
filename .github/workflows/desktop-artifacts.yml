name: Desktop Artifacts

env:
  GOTRACEBACK: all
  # "|" falls back to direct on any proxy error (e.g. HTTP/2 INTERNAL_ERROR), not just 404/410.
  GOPROXY: "https://proxy.golang.org|direct"

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      r2_cli:
        description: Build Windows and macOS R2 command-line downloads
        type: boolean
        default: false
  # macOS builds live in desktop-macos-main.yml.
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop-artifacts.yml'
      - '.github/actions/build-desktop-artifact/**'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Timeout p99 measurements: https://github.com/kenn-io/agentsview/pull/2547
jobs:
  frontend:
    if: ${{ !inputs.r2_cli }}
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.53.2

      - run: make frontend

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-frontend
          path: frontend/dist
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  build:
    name: Desktop Build (${{ matrix.name }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            timeout: 29
            bundle: nsis
            target_triple: ""
            artifact_name: agentsview-desktop-windows
            artifact_dir: desktop/src-tauri/target/release/bundle/nsis/
          - name: Linux
            os: ubuntu-latest
            timeout: 74
            bundle: appimage
            target_triple: ""
            artifact_name: agentsview-desktop-linux
            artifact_dir: desktop/src-tauri/target/release/bundle/appimage/
          - name: Linux (arm64)
            os: ubuntu-22.04-arm
            timeout: 23
            bundle: appimage
            target_triple: aarch64-unknown-linux-gnu
            artifact_name: agentsview-desktop-linux-arm64
            artifact_dir: desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: desktop-frontend
          path: frontend/dist

      - uses: $/.github/actions/build-desktop-artifact
        with:
          frontend_prebuilt: 'true'
          bundle: ${{ matrix.bundle }}
          target_triple: ${{ matrix.target_triple }}
          artifact_name: ${{ matrix.artifact_name }}
          artifact_dir: ${{ matrix.artifact_dir }}

  r2-cli:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r2_cli }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-amd64
          - runner: macos-26
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: msys2/setup-msys2@v2.33.0
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make SHELL=/usr/bin/bash build-release
          mkdir -p dist/r2
          cp agentsview dist/r2/agentsview.exe
          dist/r2/agentsview.exe version
      - name: Build macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          make build-release
          ./agentsview version
          mkdir -p dist/r2
          tar -czf "dist/r2/agentsview-r2-${{ matrix.target }}.tar.gz" agentsview
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: agentsview-r2-${{ matrix.target }}
          path: dist/r2/*
          if-no-files-found: error
